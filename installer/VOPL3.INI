; VOPL3 renderer settings (read by VOPLSRV.EXE at startup, and re-read live
; when you press Apply in the VOPL3 control panel, VOPLCFG.EXE)
[renderer]
; FM output volume, in percent. 100 = the OPL3 chip's native digital level
; (authentic, but quiet next to SBEMUL's digital sound ). 200 = double (+6 dB,
; the default). Maximum 400. Very high values may clip on loud music.
; Easiest changed from the control panel (applies live).
volume=200

; Sound device the FM plays on, given by name exactly as Windows shows it
; (Control Panel > Multimedia > Audio, or the control panel's list).
; Empty = whatever Windows plays on (the preferred playback device). Useful
; when the machine has more than one card and you want the FM on a particular
; one. This is the FM's output only - DOS MIDI goes to the MIDI device set
; under [midi] below. A name no installed device answers to falls back to the
; default device rather than going silent.
; Easiest changed from the control panel (applies live).
device=

; Total audio buffering in milliseconds. Default 160, range 40-960.
; Raise this (e.g. 480) if FM audio stutters in a REGULAR pattern - a tiny
; snippet repeating about every half second - which happens on sound drivers
; that deliver their buffer completions late or in bursts. The cost is a
; higher delay between a game playing an FM sound and you hearing it.
; Takes effect the next time VOPLSRV.EXE starts.
buffer=160

; Output sample rate in Hz: 11025, 16000, 22050, 32000, 44100 or 48000
; (the default). Any other value is treated as 48000.
; With the Nuked and ymfm renderers, the OPL3 engine itself always runs at the
; chip's native rate, 49716 Hz (about 49.7 kHz), and its output is resampled to
; this rate - so this setting does not change the OPL3 engine's CPU use. (The
; DOSBox DBOPL renderer computes directly at this rate.)
; Leave it at 48000 unless you have a reason: eg. on sound hardware that runs at
; 44.1 kHz natively, 44100 spares Windows a sample-rate conversion. If the
; sound driver refuses the rate, VOPL3 falls back to 48000; the control panel
; shows the rate in use.
; Takes effect the next time VOPLSRV.EXE starts.
rate=48000

; Process priority policy:
;   auto     = realtime only while producing audio (FM playing or MIDI
;              flowing), normal priority when idle. The default.
;   realtime = hold realtime priority the whole time (the pre-A04 behaviour;
;              try this if music that was fine on older versions now misses
;              or delays notes at song starts).
;   normal   = never raise priority (for diagnostics only - music will
;              stutter when a game loads the CPU).
; Applies live on a control-panel Apply.
priority=auto

; Release the sound device after this many seconds of FM silence, instead of
; keeping it open and streaming silence. 0 = never release (the default),
; otherwise 5-3600 seconds. The device is taken back automatically the moment
; a DOS game touches the OPL ports again; the control panel shows
; "idle (output released)" while it is let go.
; Leave this at 0 unless you have a reason. (eg. data corruption when doing 
; file transfers between drives on some VIA chipsets). 
; Applies live on a control-panel Apply.
idleclose=0

; Timer resolution the renderer asks Windows for, in milliseconds (default 5,
; range 1-20). Windows 9x wakes a waiting program only about every 55 ms on
; its own, which would make the renderer forward MIDI in audible clumps; a
; finer timer fixes that. FM playback does not depend on it at all - it is
; driven by the sound driver's buffer-completion signal.
; Do NOT set this to 1 unless you have a reason: at 1 ms Windows runs the PC
; timer at 1000 Hz for the whole machine, and some DOS games then hang before
; they start. 5 and 10 are safe. Applies at renderer start.
timerres=5

[gui]
; The control panel can write what it sees about the MPU-401 to VOPLMPU.LOG
; next to it (which path a game took: UART, intelligent polled, or
; intelligent with interrupts, plus the counters behind it). DOS games run
; full screen, so this is the only way to watch one while it plays.
; The control panel has to be RUNNING - minimized to the tray is fine.
; 0 = off (default), 1 = on.
mpulog=0

[midi]
; MPU-401 MIDI output device for DOS-game General MIDI.
; 65535 = Windows MIDI Mapper (default) - routes to whatever synth/device you
;         select in Control Panel > Multimedia > MIDI.
; 0,1,2,... = a specific midiOut device index instead of the Mapper.
; Easiest changed from the control panel (applies live).
device=65535

; MPU-401 INTELLIGENT MODE
; 0 = emulate the simple UART interface only. Every General MIDI game from
;     about 1991 on uses that, and nothing else needs this setting.
; 1 = also emulate the original MPU-401's command set and its on-board
;     sequencer (track buffers, its own clock, interrupts). Some older titles
;     - Sierra's SCI era and friends, often with an MT-32 - never switch the
;     card to UART mode, and are silent without this.
; Takes effect when the renderer next starts.
intelligent=1

; The interrupt intelligent mode uses. It MUST match what the game is set to.
;   0    = none: the card still answers and keeps its own time, for games
;          that poll. Claims nothing from the machine.
;   9    = the usual choice, and what a card jumpered to "IRQ 2" really uses
;   3-15 = anything else the game offers.
; "IRQ 2" cannot be served: Windows will not hand out the cascade line, and
; the BIOS redirection that makes it work on real hardware does not happen in
; a DOS box. Set the game to 9 (or whatever you put here) instead.
; Changing this needs a REBOOT - the interrupt is claimed for the whole
; Windows session.
;
; Why 0 by default: taking an interrupt line is not free. While VOPL3 owns
; one, real interrupts on it are acknowledged and discarded instead of
; reaching whoever was using them.
; ONLY SET THIS TO A LINE NOTHING ELSE USES. Windows will hand over an IRQ one
; of its own drivers is working with - setting 7 on a machine whose HD-Audio
; is there hangs the boot. VOPL3 declines a line that looks busy (unmasked at
; the interrupt controller) and stays polled, which the control panel shows as
; "polled, irq IN USE" - but that check only sees what the controller shows at
; the moment it asks, so choose a free line regardless. If real interrupts do
; arrive on a line VOPL3 holds, the control panel says "<< HW IRQ xN".
irq=0

; Claim the interrupt even though the line looks busy. The check above only
; knows whether a line is unmasked, not whether anything fires on it, so it
; can refuse a line that would have been fine. This switch overrides it.
; VERIFY AFTERWARDS. The control panel shows "<< HW IRQ xN" when real
; interrupts arrive on the line VOPL3 holds; every one of those was taken from
; whatever device sent it. Measured on one machine: forcing IRQ 9, where ACPI
; lives, swallowed 16 interrupts during a single boot - so "ACPI is on 9 and
; never fires" is not a safe assumption. If that counter moves at all, set
; this back to 0 (or irq=0) and reboot: the line is not free.
irqforce=0
